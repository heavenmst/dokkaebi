<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>건의 · 수정 · 요청</title>
<style>
:root{--bg:#F5F6F8;--card:#FFF;--line:#E3E6EB;--tx:#1A1D23;--sub:#5B6472;--dim:#8A93A0;--acc:#1F5EFF;--dn:#DC2626}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.55 "Pretendard","맑은 고딕",system-ui,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:18px 16px 40px}
h1{font-size:24px;margin:0 0 2px}.sub{color:var(--sub);font-size:12.5px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:14px}
input,select,textarea{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#FFF;color:var(--tx)}
textarea{width:100%;min-height:110px;resize:vertical}
button{font:inherit;padding:8px 16px;border:1px solid var(--acc);border-radius:8px;background:var(--acc);color:#FFF;font-weight:700;cursor:pointer}
button.g{background:#FFF;color:var(--sub);border-color:var(--line);font-weight:400}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.post{border-top:1px solid var(--line);padding:12px 2px}.post:first-child{border-top:0}
.post .h{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--sub)}
.post .h b{color:var(--tx);font-size:14px}.post .t{white-space:pre-wrap;word-break:break-word;margin-top:4px}
.kd{padding:1px 8px;border-radius:10px;font-size:12px;font-weight:700}.k-건의{background:#EAF0FF;color:var(--acc)}.k-요청{background:#FFF4E0;color:#B7791F}.k-수정{background:#FDECEC;color:var(--dn)}.k-오류{background:#FDECEC;color:var(--dn)}
.post .ac{margin-left:auto;display:flex;gap:4px}.post .ac button,.post .ed button{padding:2px 10px;font-size:12px}
.post .ed{margin-top:6px}.post .ed .row{margin:6px 0 0}.post .ed input{width:80px;padding:4px 8px}.post .em{font-size:12.5px;color:var(--dn)}
/* ── 모바일 (11/23) ── */
@media(max-width:760px){
.wrap{padding:12px 10px 32px}
h1{font-size:20px}.sub{font-size:12.5px;margin-bottom:10px}
.card{padding:12px;border-radius:14px;margin-bottom:10px}
input,select,textarea{font-size:16px;min-height:40px}
textarea{min-height:120px}
button{min-height:40px;padding:8px 18px}
#send{flex:0 0 auto}
.filt{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}.filt::-webkit-scrollbar{display:none}
.filt button{flex:0 0 auto;min-height:36px;padding:6px 14px}
.post .h{flex-wrap:wrap;gap:4px 8px}
}
</style></head><body><div class="wrap">
<h1>건의 · 수정 · 요청</h1>
<div class="sub">계산기에 바라는 점(건의), 틀린 숫자(수정), 추가했으면 하는 기능(요청)을 남겨 주세요. 올린 글은 누구나 볼 수 있고, 내가 쓴 글은 비밀번호 2글자로 고치거나 지울 수 있어요.</div>
<div class="card">
 <div class="row"><span id="nickT" style="font-size:13px;color:var(--sub)"></span></div>
 <textarea id="body" maxlength="2000" placeholder="내용 (2,000자까지)"></textarea>
 <div class="row" style="margin-top:8px;margin-bottom:0"><button id="send">올리기</button><span id="msg" style="font-size:13px;color:var(--sub)"></span></div>
</div>
<div class="card">
 <div id="list"><div style="color:var(--dim)">불러오는 중…</div></div>
</div>
</div>
<script>
const SUPA={"url":"https://ibzlvxjzgdbrnuydqrym.supabase.co","key":"sb_publishable_G37kFCD1FyTo6tCNaaAh-w_xObz5L88"},$=id=>document.getElementById(id);
const ld=(k,d)=>{try{const v=localStorage.getItem('bd_'+k);return v==null?d:JSON.parse(v)}catch(e){return d}};
const sv=(k,v)=>{try{localStorage.setItem('bd_'+k,JSON.stringify(v))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sb=(path,opt={})=>fetch(SUPA.url.replace(/\/$/,'')+'/rest/v1/'+path,Object.assign({},opt,{headers:Object.assign({apikey:SUPA.key,Authorization:'Bearer '+SUPA.key,'Content-Type':'application/json'},opt.headers||{})}));
let ALL=[];
const when=t=>{const d=new Date(t);return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`};
function draw(){const me=NICK().trim();
  $('list').innerHTML=ALL.length?ALL.map(p=>`<div class="post" data-id="${esc(p.id)}"><div class="h"><b>${esc(p.nick)}</b><span>${when(p.created_at)}${p.edited_at?' (수정됨 '+when(p.edited_at)+')':''}</span>${me&&p.nick===me?'<span class="ac"><button class="g" data-a="e">수정</button><button class="g" data-a="d">삭제</button></span>':''}</div><div class="t">${esc(p.body)}</div><div class="ed"></div></div>`).join(''):'<div style="color:var(--dim)">아직 글이 없어요</div>';}
const RMSG={bad:'비밀번호가 달라요',notmine:'내 글이 아니에요',nopost:'이미 지워진 글이에요',badbody:'내용을 확인해 주세요 (1~2,000자)'};
async function postEdit(id,pw,body){const r=await sb('rpc/post_edit',{method:'POST',body:JSON.stringify({p_id:id,p_nick:NICK().trim(),p_pw:pw,p_body:body})});if(!r.ok)throw new Error(r.status+' '+(await r.text()).slice(0,80));return r.json()}
async function load(){if(!SUPA.url){$('list').innerHTML='<div style="color:var(--dim)">게시판 준비 중이에요 (공용 저장소 연결 전)</div>';return}
  try{const r=await sb('posts?select=*&order=id.desc&limit=300');if(!r.ok)throw new Error(r.status);ALL=await r.json();draw()}catch(e){$('list').innerHTML='<div style="color:var(--dn)">못 불러왔어요 ('+esc(e.message)+')</div>'}}
$('list').onclick=async e=>{const b=e.target.closest('[data-a]');if(!b)return;const P=b.closest('.post'),ed=P.querySelector('.ed'),t=P.querySelector('.t'),a=b.dataset.a,id=Number(P.dataset.id);
  const pwRow=(btn,lab)=>`<div class="row"><input type="password" maxlength="2" placeholder="비밀번호" autocomplete="off"><button data-a="${btn}">${lab}</button><button class="g" data-a="c">취소</button><span class="em"></span></div>`;
  if(a==='e'){const p=ALL.find(x=>x.id===id);ed.innerHTML='<textarea maxlength="2000"></textarea>'+pwRow('s','저장');ed.querySelector('textarea').value=p?p.body:t.textContent;t.style.display='none';ed.querySelector('textarea').focus();return}
  if(a==='d'){t.style.display='';ed.innerHTML='<div class="em" style="color:var(--sub)">이 글을 지울까요? 비밀번호 2글자를 넣고 삭제를 누르세요.</div>'+pwRow('x','삭제');ed.querySelector('input').focus();return}
  if(a==='c'){ed.innerHTML='';t.style.display='';return}
  if(a==='s'||a==='x'){const em=ed.querySelector('span.em'),pw=ed.querySelector('input').value;let body=null;
    if(pw.length!==2){em.textContent='비밀번호 2글자를 넣어 주세요';return}
    if(a==='s'){body=ed.querySelector('textarea').value.trim();if(!body){em.textContent='내용을 넣어 주세요';return}}
    b.disabled=true;em.textContent=a==='s'?'저장 중…':'지우는 중…';
    try{const res=await postEdit(id,pw,body);if(res==='ok'||res==='deleted'){load();return}em.textContent=RMSG[res]||('실패: '+res)}catch(err){em.textContent='실패: '+err.message}
    b.disabled=false}};
const NICK=()=>{try{return localStorage.getItem('site_nick')||''}catch(e){return''}};
const drawN=()=>{$('nickT').innerHTML=NICK()?`작성자 <b>${esc(NICK())}</b>`:'<span style="color:var(--dn)">닉네임이 없어요 — 위쪽 👤을 눌러 닉네임을 정해 주세요</span>'};drawN();addEventListener('storage',e=>{if(e.key==='site_nick')drawN()});addEventListener('focus',drawN);
$('send').onclick=async()=>{const nick=NICK().trim(),body=$('body').value.trim();drawN();
  if(!nick){$('msg').textContent='위쪽 👤을 눌러 닉네임을 먼저 정해 주세요';return}if(!body){$('msg').textContent='내용을 넣어 주세요';return}
  const last=ld('last',0);if(Date.now()-last<30000){$('msg').textContent='30초에 한 번만 올릴 수 있어요';return}
  if(!SUPA.url){$('msg').textContent='공용 저장소 연결 전이에요';return}
  $('send').disabled=true;$('msg').textContent='올리는 중…';
  try{const r=await sb('posts',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({nick,kind:'건의',body})});if(!r.ok)throw new Error(r.status+' '+(await r.text()).slice(0,80));
    sv('last',Date.now());$('body').value='';$('msg').textContent='✔ 올렸어요';load()}catch(e){$('msg').textContent='실패: '+e.message}
  $('send').disabled=false};
load();
</script></body></html>
