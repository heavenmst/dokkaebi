<style>
:root{--bg:#F6F7F9;--card:#FFFFFF;--line:#E3E6EB;--line2:#CBD0D8;--tx:#1F2429;--sub:#5B6472;--acc:#1F5EFF;--accbg:#EAF0FF}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Malgun Gothic","맑은 고딕","Apple SD Gothic Neo",sans-serif;display:flex;flex-direction:column}
header{background:var(--card);border-bottom:1px solid var(--line);box-shadow:0 1px 2px rgba(0,0,0,.04)}
.bar{max-width:1440px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}

nav svg{width:18px;height:18px}
.note{margin-left:auto;color:var(--sub);font-size:12px;display:flex;flex-wrap:wrap;gap:4px 12px;justify-content:flex-end;max-width:640px}.note b{color:var(--tx)}

@media(max-width:700px){.note{margin-left:0;justify-content:flex-start;font-size:11px}nav a{padding:7px 10px;font-size:14px}.bar{gap:10px}}
#login{position:fixed;inset:0;background:rgba(20,24,32,.55);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:99;padding:16px}
#login .box{background:#FFF;border-radius:18px;padding:28px 28px 22px;width:100%;max-width:400px;box-shadow:0 12px 40px rgba(0,0,0,.25);text-align:center}
#login h1{font-size:22px;margin:0 0 4px}#login h1 span{color:var(--acc)}
#login .tip{background:#FFF8E6;border:1px solid #F3DFA8;color:#8A5A00;border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.55;margin:14px 0 16px;text-align:left}
#login input{width:100%;padding:11px 12px;font-size:15px;border:1px solid var(--line2);border-radius:10px;margin-bottom:10px;text-align:center}
#login button{width:100%;padding:11px;font-size:15px;font-weight:800;border:0;border-radius:10px;background:var(--acc);color:#FFF;cursor:pointer}
#login .skip{background:none;color:var(--sub);font-weight:400;font-size:13px;margin-top:4px;padding:6px}
#who{font-size:12px;color:var(--sub);cursor:pointer}#who b{color:var(--acc)}
/* ── 모바일 (11/23): 로고+👤 한 줄 / 탭 가로 스크롤 한 줄 / 정보 한 줄 ── */
@media(max-width:760px){
header{position:relative;z-index:2}
.bar{padding:8px 0 0;gap:4px 8px;flex-wrap:wrap}
.logo{order:0;flex:1 1 0;min-width:0;font-size:16px;padding-left:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
#who{order:1;flex:0 0 auto;padding:6px 12px 6px 4px;font-size:13px;max-width:45%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
nav{order:2;width:100%;flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;gap:6px;padding:2px 12px 8px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
nav::-webkit-scrollbar{display:none}
nav a{flex:0 0 auto;white-space:nowrap;padding:8px 12px;font-size:14px;min-height:38px;border-color:var(--line);background:var(--card)}
nav a.on{border-color:#C9D7FF}
nav svg{width:16px;height:16px}
.note{order:3;width:100%;max-width:none;margin:0;padding:5px 12px;font-size:11px;background:var(--bg);border-top:1px solid var(--line);flex-wrap:nowrap;overflow-x:auto;white-space:nowrap;justify-content:flex-start;scrollbar-width:none}
.note::-webkit-scrollbar{display:none}
#login{padding:12px;align-items:flex-start;padding-top:max(12px,6vh);overflow-y:auto}
#login .box{padding:22px 16px 16px;border-radius:16px}
#login h1{font-size:19px;line-height:1.35}#login h1 span{display:block;font-size:16px}
#login .tip{font-size:12.5px;margin:12px 0 14px}
#login input{font-size:16px;min-height:46px}#login input::placeholder{font-size:13px}
#login button{font-size:16px;min-height:46px}
}
</style></head><body>
<div id="login"><div class="box"><h1>도깨비의 세계 <span>- 몽련1 연문파</span></h1><div style="color:var(--sub);font-size:13px">사냥터 효율 · 도술 DPS · 성장 목표 · 금전시세</div>
 <div class="tip">📌 <b>참고용으로만 봐 주세요.</b><br>게임 클라이언트 자료로 계산했지만 실제 게임과 다르거나 틀린 부분이 있을 수 있어요. 이상한 점은 「건의 · 수정 · 요청」에 남겨 주세요.</div>
 <div style="font-size:13px;font-weight:700;color:#1F5EFF;margin:0 0 6px;text-align:left">⚠ 닉네임은 꼭 <u>인게임 닉네임</u>으로 적어 주세요 (랭킹·게시판에 그대로 보여요)</div><input id="lgNick" maxlength="20" placeholder="인게임 닉네임을 입력해 주세요!" autocomplete="nickname"><input id="lgPw" type="password" maxlength="2" placeholder="비밀번호 2글자 (처음이면 지금 정한 걸로 등록)" autocomplete="off"><div id="lgMsg" style="min-height:18px;font-size:13px;margin:-2px 0 8px"></div><button id="lgGo">입장하기</button></div></div>
<header><div class="bar">
 <div class="logo">도깨비의 세계 <span>- 몽련1 연문파</span></div>
 <nav>
  <a href="#hunt" data-t="hunt"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 20l6-12 4 7 3-4 5 9z"/><circle cx="17" cy="5" r="2"/></svg>사냥터 효율</a>
  <a href="#dps" data-t="dps"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M14.5 3.5l6 6L10 20l-6 0 0-6z"/><path d="M12 6l6 6"/></svg>도술 DPS</a>
  <a href="#growth" data-t="growth"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>성장 목표</a>
  <a href="#salvage" data-t="salvage"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/></svg>금전시세 / 분해 계산</a>
  <a href="#board" data-t="board"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>건의 · 수정 · 요청</a>
 </nav>
 <div class="note" id="info"></div><div id="who" title="누르면 닉네임 바꾸기"></div>
</div></header>
<main>
 <iframe id="f-hunt" data-src="hunt.html" title="사냥터 효율 계산기"></iframe>
 <iframe id="f-dps" data-src="dps.html" title="도술 DPS 계산기"></iframe>
 <iframe id="f-growth" data-src="growth.html" title="성장 목표 계산기"></iframe>
 <iframe id="f-board" data-src="board.html" title="건의 · 수정 · 요청"></iframe>
 <iframe id="f-salvage" data-src="salvage.html" title="금전시세 / 분해 계산"></iframe>
</main>
<script>
const TABS=['hunt','dps','growth','salvage','board'];
function show(){
 let t=(location.hash||'').slice(1); if(!TABS.includes(t)) t='hunt';
 TABS.forEach(k=>{const f=document.getElementById('f-'+k), on=k===t;
  if(on&&!f.src) f.src=f.dataset.src;   // 처음 누를 때만 불러오고 이후엔 입력 상태 유지
  f.classList.toggle('on',on);
  document.querySelector(`nav a[data-t="${k}"]`).classList.toggle('on',on);});
 document.title={hunt:'사냥터 효율',dps:'도술 DPS',growth:'성장 목표',salvage:'금전시세 / 분해 계산',board:'건의 · 수정 · 요청'}[t]+' · 도깨비의 세계 - 몽련1 연문파';
}
const INFO={"client": "도깨비의 세계 PC 클라이언트 (Unity 6000.3)", "client_patch": "2026-11-18 대격변 패치", "client_note": "드랍표·도술 수치·지도 = 이 패치 클라이언트에서 직접 추출", "ver": "1.311", "updated": "2026-11-24 13:25"};
document.getElementById('info').innerHTML=`<span>마지막 업데이트 <b>${INFO.updated}</b></span><span>버전 <b>v${INFO.ver}</b></span><span title="${INFO.client_note}">클라이언트 <b>${INFO.client}</b></span><span>클라이언트 업데이트 <b>${INFO.client_patch}</b></span><span>제작자 : <b>돼</b></span>`;
// 11/23 사용자: 들어올 때마다 닉네임 확인 화면 (게시판·랭킹이 같은 닉네임 사용)
const NK='site_nick',getN=()=>{try{return localStorage.getItem(NK)||''}catch(e){return''}};
function drawWho(){const n=getN();document.getElementById('who').innerHTML=n?`👤 <b>${n.replace(/</g,'&lt;')}</b>`:'👤 닉네임 없음';}
// 11/23 사용자: 닉네임(아이디)별 저장값 분리 — 새 아이디는 전부 0/빈칸/체크 해제로 시작
// 개인 키 = hc_*(사냥터 효율) · sv_*(금전시세/분해) · hm_dps_*(도술 DPS) · growth_plan_v1(성장 목표). site_nick·bd_*(게시판)은 공용
// 다른 닉으로 들어오면: 지금 개인 키 → 'u:<옛닉>:키' 로 보관, 새 닉 보관분 있으면 복원(없으면 빈 상태) → 계산기 다시 열기
const UK=k=>/^(hc_|sv_|hm_dps_)/.test(k)||k==='growth_plan_v1', UP=n=>'u:'+encodeURIComponent(n)+':';
function swapUser(prev,n){
 try{const LS=localStorage,keys=[];for(let i=0;i<LS.length;i++)keys.push(LS.key(i));
  // 열린 계산기를 먼저 완전히 닫음 (닫히기 전 storage 이벤트로 옛 값을 다시 저장하는 것 방지)
  const fr=TABS.map(k=>document.getElementById('f-'+k)),box=fr[0].parentNode;fr.forEach(f=>{f.remove();f.removeAttribute('src')});
  const po=UP(prev),pn=UP(n);
  keys.filter(k=>k.startsWith(po)).forEach(k=>LS.removeItem(k));
  keys.filter(UK).forEach(k=>{LS.setItem(po+k,LS.getItem(k));LS.removeItem(k)});
  keys.filter(k=>k.startsWith(pn)).forEach(k=>{const b=k.slice(pn.length);if(UK(b))LS.setItem(b,LS.getItem(k));LS.removeItem(k)});
  fr.forEach(f=>box.appendChild(f));show();
 }catch(e){console.warn('swapUser',e)}}
function enter(n){try{if(n!=null){const prev=getN();if(prev&&prev!==n)swapUser(prev,n);localStorage.setItem(NK,n)}}catch(e){}document.getElementById('login').style.display='none';drawWho();}
// 11/23 두 글자 비밀번호 (Supabase RPC site_login, 비밀번호는 저장 안 함)
const SUPA={url:'https://ibzlvxjzgdbrnuydqrym.supabase.co',key:'sb_publishable_G37kFCD1FyTo6tCNaaAh-w_xObz5L88'};
// 11/23 운영자 전용 방문 기록 (화면엔 안 보임): 입장 닉네임·보는 탭을 1분마다 한 줄 → 하루 방문자·이용 시간 집계 (읽기는 운영자 비밀키 RPC만)
(function(){let sid='';try{sid=sessionStorage.getItem('vsid')||'';if(!sid){sid=Math.random().toString(36).slice(2)+Date.now().toString(36);sessionStorage.setItem('vsid',sid)}}catch(e){sid=Math.random().toString(36).slice(2)}
 const beat=()=>{try{if(document.visibilityState!=='visible')return;const nick=(localStorage.getItem('site_nick')||'').slice(0,20);if(!nick||document.getElementById('login').style.display!=='none')return;
   const tab=((location.hash||'').slice(1)||'hunt').slice(0,20);
   fetch(SUPA.url+'/rest/v1/visit_log',{method:'POST',headers:{apikey:SUPA.key,Authorization:'Bearer '+SUPA.key,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify({sid,nick,tab}),keepalive:true}).catch(()=>{});}catch(e){}};
 setTimeout(beat,5000);setInterval(beat,60000);addEventListener('hashchange',()=>setTimeout(beat,1500));})();
const $id=i=>document.getElementById(i);
function lgMsg(t,c){const m=$id('lgMsg');m.textContent=t||'';m.style.color=c||'var(--sub)';}
function focusLogin(){const nk=$id('lgNick');(nk.value.trim()?$id('lgPw'):nk).focus();}
let lgBusy=false;
async function tryLogin(){
 if(lgBusy)return;
 const n=$id('lgNick').value.trim(),p=$id('lgPw').value;
 if(!n){lgMsg('닉네임을 입력해 주세요','#D33');$id('lgNick').focus();return}
 if([...p].length!==2){lgMsg('비밀번호는 정확히 2글자예요','#D33');$id('lgPw').focus();return}
 lgBusy=true;$id('lgGo').disabled=true;lgMsg('확인 중…');
 let r;
 try{
  const res=await fetch(`${SUPA.url}/rest/v1/rpc/site_login`,{method:'POST',headers:{apikey:SUPA.key,Authorization:'Bearer '+SUPA.key,'Content-Type':'application/json'},body:JSON.stringify({p_nick:n,p_pw:p})});
  if(!res.ok)throw new Error('HTTP '+res.status);
  r=await res.json();
 }catch(e){r=null}
 lgBusy=false;$id('lgGo').disabled=false;
 if(r==='ok'){$id('lgPw').value='';lgMsg('');enter(n);}
 else if(r==='new'){$id('lgPw').value='';lgMsg('등록됐어요','#1A8F3C');setTimeout(()=>{enter(n);lgMsg('')},900);}
 else if(r==='bad'){lgMsg('비밀번호가 달라요','#D33');$id('lgPw').value='';$id('lgPw').focus();}
 else if(r==='badnick'){lgMsg('닉네임을 확인해 주세요 (사용할 수 없는 닉네임)','#D33');$id('lgNick').focus();}
 else if(r==='badpw'){lgMsg('비밀번호는 정확히 2글자로 정해 주세요','#D33');$id('lgPw').focus();}
 else{lgMsg('서버 연결 실패 — 잠시 후 다시','#D33');}
}
$id('lgNick').value=getN();
$id('lgGo').onclick=tryLogin;
$id('lgNick').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();$id('lgPw').value?tryLogin():$id('lgPw').focus()}};
$id('lgPw').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();tryLogin()}};
$id('who').onclick=()=>{$id('login').style.display='flex';$id('lgPw').value='';lgMsg('');focusLogin()};
setTimeout(focusLogin,50);
addEventListener('hashchange',show); show();
</script>
</body></html>
